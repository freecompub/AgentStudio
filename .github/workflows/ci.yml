# Vérification de chaque poussée : types, suite de tests complète, puis build.
# Aucun appel réel au LLM (§16) : les tests d'intégration utilisent un `AgentRuntime` scripté.
name: CI

on:
  # Toutes les branches : le travail reste vérifié même hors pull request — une PR fusionnée
  # cesse de déclencher la CI sur sa branche.
  push:
    branches: ["**"]
  pull_request:

# Une PR mise à jour annule le run précédent, encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Types et tests
    # Une PR interne est déjà couverte par le push sur sa branche : on ne la vérifie deux fois
    # que si elle vient d'un dépôt externe, dont les commits n'ont pas déclenché de push ici.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Aucun test n'importe `electron` : son binaire (~250 Mo) est inutile ici.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      # La version de pnpm vient du champ `packageManager` du package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Version embarquée par Electron 44, donc celle sur laquelle l'application tourne
          # réellement. Le modèle de permissions des extensions isolées exige `--permission`,
          # disponible à partir de Node 22.13 / 23.5.
          node-version: "24"
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier les types
        run: pnpm typecheck

      # Les tests Swift sont sautés d'eux-mêmes si la chaîne est absente (J5) : elle n'est pas
      # installée ici, les tests Swift ne sont donc pas couverts par cette CI.
      - name: Lancer les tests
        run: pnpm test

      - name: Construire l'application
        run: pnpm build

  # Essais de bout en bout : la VRAIE application Electron, lancée depuis son build.
  #
  # Job séparé pour une raison concrète : il exige le binaire Electron (~250 Mo), que le job
  # ci-dessus ne télécharge pas. Il ne part qu'une fois les types et la suite verts — inutile de
  # payer ce téléchargement pour une branche qui ne compile pas.
  #
  # Aucune requête à Copilot : l'application démarre en mode d'essai, runtime scripté
  # (apps/desktop/src/main/mode-essai.ts), et ce mode est impossible dans une application
  # empaquetée.
  bout-en-bout:
    name: Essais de bout en bout (Electron)
    needs: verification
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # Sans ELECTRON_SKIP_BINARY_DOWNLOAD, contrairement au job précédent : ici le binaire sert.
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Le cache pnpm est partagé avec le job précédent, qui installe en sautant le binaire. pnpm
      # y retient qu'electron est « construit », donc son script d'installation ne se rejoue pas
      # ici : le binaire se téléchargeait alors au premier `require`, c'est-à-dire PENDANT un essai.
      # Un réseau lent faisait ainsi échouer un test au lieu d'une étape d'installation, ce qui
      # désigne le mauvais coupable. Cette étape rend le téléchargement explicite et attribuable.
      - name: S'assurer du binaire Electron
        run: pnpm rebuild electron

      - name: Construire l'application
        run: pnpm build

      # Aucun navigateur à installer : `_electron` de Playwright pilote l'Electron du projet.
      # `xvfb-run` fournit l'affichage que le runner n'a pas.
      - name: Lancer les essais
        run: xvfb-run -a pnpm e2e

      - name: Verser les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: essais-bout-en-bout
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
