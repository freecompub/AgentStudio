# Profil d'exemple — Swift avec SwiftPM et XCTest.
#
# À copier dans `.agent-studio/stack.yaml` à la racine d'un projet, puis à ajuster.
id: swift

detect: [Package.swift]

tests:
  command: [swift, test, --parallel, "--xunit-output={rapport}"]
  report: junit-xml

lint:
  command: [swiftlint, lint, --quiet, --reporter, json, "--", "{fichiers}"]
  report: swiftlint-json

mutation:
  command: [muter, run, --skip-coverage, --format, json, "--output", "{rapport}"]
  report: muter-json

layout:
  acceptanceTests: ["Tests/AcceptanceTests/**"]
  unitTests: ["Tests/**"]
  sources: ["Sources/**"]

infrastructureModules: [Infrastructure, Interface, UI, API, SwiftUI, UIKit, AppKit]
