# Catalogue de la plateforme : ce qu'une fonctionnalité peut appeler sans le déclarer.
#
# PROPOSITION (docs/08) : la liste et les paramètres de ce que le cœur devra fournir pour exécuter
# une fonctionnalité. Propriétaire : la plateforme. Chaque élément a des paramètres fermés ; une
# étape ou un contrôle qui passe un paramètre inconnu, ou omet un paramètre obligatoire, est refusé
# au téléversement.
#
# Une sortie est une table de champs. Les références `sorties.<id>.<champ>` (étape) et
# `sortie.<champ>` (contrôle d'une action) ne peuvent viser qu'un champ déclaré ici. Les sorties des
# contrôles d'une action s'ajoutent à la sortie de l'action sous `controles.<verification>`.

format: agent-studio/catalogue@1

operations:
  # ── Fichiers (Workspace) ──
  lire-fichier:
    parametres: { chemin: { type: texte, obligatoire: true } }
    sorties: [contenu]
  lister-fichiers:
    parametres: { motifs: { type: liste, obligatoire: true } }
    sorties: [fichiers]
  enregistrer:
    parametres: { chemin: { type: texte, obligatoire: true }, contenu: { type: texte, obligatoire: true } }
    sorties: []
  creer-dossier:
    parametres: { chemin: { type: texte, obligatoire: true } }
    sorties: []
  geler:
    description: "Empreinte des fichiers ; un contrôle gel-intact la compare plus tard."
    parametres: { motifs: { type: liste, obligatoire: true } }
    sorties: [empreinte]
  # ── Git ──
  noter-depart:
    parametres: {}
    sorties: [sha]
  creer-branche:
    parametres: { nom: { type: texte, obligatoire: true } }
    sorties: []
  poser-checkpoint:
    description: "Point de retour nommé. Le moteur en pose aussi un avant chaque étape."
    parametres: { nom: { type: texte, obligatoire: true } }
    sorties: [checkpoint]
  rembobiner:
    description: "Retour au checkpoint, avec oubli des sessions qui ont travaillé depuis (ADR 0050)."
    parametres: { vers: { type: texte, obligatoire: true } }
    sorties: []
  commiter:
    parametres: { message: { type: texte, obligatoire: true } }
    sorties: [sha]
  lire-diff:
    parametres: { depuis: { type: texte, obligatoire: true } }
    sorties: [fichiers]                      # [{ path, status: added | modified | deleted }]
  # ── Exécution (commandes de stack.yaml ; preuves enregistrées) ──
  lancer-tests:
    parametres: { filtre: { type: texte } }
    sorties: [resultats, verts, rouges]      # resultats : [{ id, file, status, failureKind, message }]
  mesurer-couverture:
    parametres: {}
    sorties: [par-fichier, par-couche]
  mesurer-mutation:
    parametres: { fichiers: { type: liste } }
    sorties: [score, survivants]             # survivants : défauts adressables au testeur (ADR 0049)
  # ── Sessions ──
  reinitialiser:
    parametres: { session: { type: texte, obligatoire: true } }
    sorties: []
  # ── Humain et faits ──
  informer:
    parametres: { message: { type: texte, obligatoire: true } }
    sorties: []
  retenir:
    description: "Enregistre une valeur dans le fait désigné par la propriété « retenir » de l'étape."
    parametres: { valeur: { type: objet, obligatoire: true } }
    sorties: []
  verifier:
    description: "Exécute une vérification comme une étape : ko si elle échoue."
    parametres: { verification: { type: texte, obligatoire: true }, avec: { type: objet } }
    sorties: [controle]

primitives:
  boucle:
    etapes: true                             # répète ou distribue les étapes de l'appel
    description: "Répète ses étapes jusqu'à la condition, au plus « plafond » fois ; au-delà, échec."
    parametres: { jusqu-a: { type: texte, obligatoire: true }, plafond: { type: nombre, obligatoire: true } }
    sorties: [tours]
  pour-chaque:
    etapes: true                             # répète ou distribue les étapes de l'appel
    description: "Exécute ses étapes pour chaque élément, en séquence ; l'élément est « courant.<comme> »."
    parametres: { liste: { type: liste, obligatoire: true }, comme: { type: texte, obligatoire: true } }
    sorties: [resultats]                     # [{ element, sortie }]
  en-parallele:
    etapes: true                             # répète ou distribue les étapes de l'appel
    description: "Comme pour-chaque, simultanément ; chaque élément doit utiliser une session différente."
    parametres: { liste: { type: liste, obligatoire: true }, comme: { type: texte, obligatoire: true } }
    sorties: [resultats]
  revue:
    description: >-
      Revue d'une phase par des lentilles (SPEC-skraft §9) : appelle l'action de chaque lentille en
      parallèle, tient les fils de défauts (identifiants, cibles test/code/livrable, réponses des
      agents, arbitrages, ADR 0046), puis synthétise le verdict. ok si APPROVED ; ko sinon, avec les
      défauts actifs pour motifs. Deux lentilles REJECTED : escalade. Désaccord maintenu deux fois :
      l'action « arbitre ».
    parametres:
      phase: { type: texte, obligatoire: true }
      lentilles: { type: liste, obligatoire: true }
      relecteurs: { type: objet, obligatoire: true }    # lentille → action d'agent
      arbitre: { type: texte, obligatoire: true }       # action humaine
    sorties: [verdict, defauts-actifs, rapport]         # defauts-actifs : { test, code, livrable }

verifications:
  tests-passent:
    parametres: { tests: { type: liste }, sauf-en-attente: { type: booleen } }
  rouge-pour-bonne-raison:
    description: "Le test (par défaut : le seul nouveau test) échoue sur une assertion ou un symbole manquant."
    parametres: { test: { type: texte } }
    sorties: [test]
  rien-ne-regresse:
    parametres: { tests-disparus: { type: booleen } }
  un-seul-nouveau-test:
    parametres: {}
    sorties: [test]
  nouveaux-tests-verts-ou-rouges-pour-bonne-raison:
    parametres: {}
    sorties: [rouges]
  sequence-rouge-puis-vert:
    description: "Chaque test unitaire écrit depuis le checkpoint a été vu rouge (bonne raison) puis vert."
    parametres: { depuis: { type: texte, obligatoire: true } }
  est-le-test:
    parametres: { propose: { type: texte, obligatoire: true }, attendu: { type: texte, obligatoire: true } }
  gel-intact:
    parametres: { empreinte: { type: texte }, motifs: { type: liste } }
  perimetre-respecte:
    parametres: { motifs: { type: liste, obligatoire: true } }
  aucun-fichier-modifie:
    parametres: {}
  production-modifiee:
    parametres: {}
  fichier-present:
    parametres: { chemin: { type: texte, obligatoire: true } }
  seuils-atteints:
    description: "Seuils de .agent-studio/quality.yaml, par couche (ADR 0049)."
    parametres: { mesure: { type: texte, obligatoire: true } }
  lint:
    parametres: {}
  dependances-respectees:
    parametres: {}
  au-plus-un-cran-de:
    parametres: { valeur: { type: texte, obligatoire: true }, reference: { type: texte, obligatoire: true }, echelle: { type: liste, obligatoire: true } }

outils:
  - list_files       # explorer le dépôt
  - run_tests        # lancer les tests : seule source de preuves
  - run_lint
  - report_blocker   # toujours disponible, même non déclaré
