# Recette skraft, décrite en planification hiérarchique (docs/08).
#
# PROPOSITION du 2026-10-04 : aucun code ne charge ce fichier. Il décrit, sans perte, ce que fait
# aujourd'hui l'extension skraft (extensions/skraft/src/), pour vérifier qu'un orchestrateur
# générique peut la porter. Chaque élément renvoie au code qui le réalise.
#
# ── Notations ────────────────────────────────────────────────────────────────────────────────
#   $story, $story.slug     entrée fournie par l'utilisateur (section `entrees`)
#   faits.difficulte        fait calculé et enregistré par le code (section `faits`)
#   contexte.stack.sources  contexte fourni par la plateforme et le projet (section `contexte`)
#   reglages.grille         réglage de la recette, surchargeable par le projet (section `reglages`)
#   "…/{$story.slug}/…"     interpolation dans une chaîne
#   vers-faits: { x: … }    la sortie de l'action est enregistrée comme fait
#
# ── Propriétaires : le préfixe d'un nom dit à qui il appartient ─────────────────────────────
#   creer-dossier           (sans préfixe, absent de ce fichier) catalogue de la PLATEFORME :
#                           action atomique, vérification, lecteur ou primitive, écrit en code
#                           dans le cœur, testé avec lui ; la recette l'appelle, ne le redéfinit pas
#   skraft.planifier-…      code de l'EXTENSION skraft (src/), enregistré sous son espace de noms ;
#                           s'exécute dans le processus isolé de l'extension
#   projet.…                script du PROJET (section `actions-script`) ; skraft n'en utilise aucun
#   classer, livrer, …      (sans préfixe, déclaré ici) action d'agent, action humaine ou tâche :
#                           appartient à l'AUTEUR DE LA RECETTE, ici l'extension skraft
#   Au chargement : un nom introuvable, ou déclaré ici alors qu'il existe dans le catalogue, est refusé.

recette: skraft
version: 0.1
proprietaire: extension:skraft
licence: GPL-3.0-or-later
tache-racine: livrer-story

# ════════════════════════════════════════════════════════════════════════════════════════════
# Entrées : ce que l'utilisateur fournit. Propriétaire : la recette (déclaration),
# l'utilisateur (valeurs). Une entrée obligatoire absente est demandée dans le chat.
# ════════════════════════════════════════════════════════════════════════════════════════════
entrees:
  story:
    type: texte
    format: skraft.story-markdown        # lecteur fourni par l'extension (story.ts, parseStory)
    source: [chat, fichier]              # collée dans le chat, ou chemin d'un fichier du dépôt
    obligatoire: true
    aide: "La user story : « # US-2 — Titre », l'énoncé, puis « ## Critères d'acceptation »"
  confirmer-difficulte:
    type: booleen
    defaut: true                         # `--auto` le passe à false
  granularite:
    type: choix
    valeurs: [tour-par-scenario, sessions-par-pas]
    obligatoire: false                   # absente : déduite de la difficulté (D22)

# Champs produits par skraft.story-markdown, référençables partout :
#   $story.id  $story.titre  $story.slug  $story.enonce  $story.brut
#   $story.criteres[] { n, texte, litteraux[] }   $story.questions-ouvertes[]

# ════════════════════════════════════════════════════════════════════════════════════════════
# Contexte : toujours présent, jamais saisi. Propriétaire : la plateforme (lecture, validation) ;
# le contenu des fichiers appartient au projet.
# ════════════════════════════════════════════════════════════════════════════════════════════
contexte:
  depot: {}                                            # arbre de travail et historique Git
  stack: { fichier: ".agent-studio/stack.yaml" }      # comment lancer tests, lint, mutation
  barre: { fichier: ".agent-studio/quality.yaml" }    # ce qui est exigé (ADR 0049)
  modeles: {}                                          # modèle choisi par classe (ADR 0048, réglages)

# ════════════════════════════════════════════════════════════════════════════════════════════
# Réglages : valeurs de la recette. Propriétaire : la recette ; le projet peut les surcharger
# dans .agent-studio/recettes/skraft.yaml (aujourd'hui codées en dur : écart 7 de docs/08 §8).
# ════════════════════════════════════════════════════════════════════════════════════════════
reglages:
  grille:                                # difficulty.ts, DEFAULT_THRESHOLDS
    challenging-modules: 3
    challenging-questions: 2
    hard-criteres: 5
    hard-modules: 3
    medium-criteres: 3
    medium-modules: 2
  effets-du-niveau:                      # difficulty.ts, levelEffects
    simple:      { recherche: false, granularite: tour-par-scenario, lentilles: [cold-reader, test-integrity], essais-max: 2 }
    medium:      { recherche: false, granularite: tour-par-scenario, lentilles: [cold-reader, test-integrity, architecture, quality-gates], essais-max: 3 }
    medium-hard: { recherche: true,  granularite: tour-par-scenario, lentilles: [cold-reader, test-integrity, architecture, quality-gates], essais-max: 3 }
    challenging: { recherche: true,  granularite: sessions-par-pas,  lentilles: [cold-reader, test-integrity, architecture, quality-gates], essais-max: 3 }
  cycles-par-scenario: 20                # D24
  phases-revues: [DESIGN, DISTILL, DELIVER]

# ════════════════════════════════════════════════════════════════════════════════════════════
# Faits : seule matière autorisée dans une condition `si:`. Propriétaire : le code (plateforme
# pour l'enregistrement, l'action désignée pour la valeur). Le chargement vérifie qu'un fait est
# établi avant toute condition qui le lit.
# ════════════════════════════════════════════════════════════════════════════════════════════
faits:
  base-sha:            { etabli-par: noter-depart }
  indicateurs:         { etabli-par: skraft.mesurer-indicateurs }
  difficulte-proposee: { etabli-par: skraft.proposer-difficulte }
  difficulte-classee:  { etabli-par: classer }
  difficulte:          { etabli-par: [confirmer-difficulte, retenir] }
  recherche:           { derive-de: difficulte, table: reglages.effets-du-niveau, champ: recherche }
  granularite:         { derive-de: difficulte, table: reglages.effets-du-niveau, champ: granularite, sauf: $granularite }
  lentilles:           { derive-de: difficulte, table: reglages.effets-du-niveau, champ: lentilles }
  essais-max:          { derive-de: difficulte, table: reglages.effets-du-niveau, champ: essais-max }
  questions-ouvertes:  { etabli-par: [skraft.story-markdown, rechercher, repondre-question-ouverte] }
  adr-proposes:        { etabli-par: decider }
  empreinte-acceptance: { etabli-par: distiller }
  scenarios:           { etabli-par: skraft.planifier-scenarios }
  scenario.deja-vert:  { etabli-par: skraft.ouvrir-scenario }
  scenario.echecs:     { etabli-par: moteur }
  defauts-actifs:      { etabli-par: skraft.synthese-revue }          # par cible : test, code, livrable (ADR 0046)
  cibles-du-developpeur: { etabli-par: corriger-tests }
  noms-du-contrat:     { etabli-par: skraft.relever-contrat }         # ADR 0047

# ════════════════════════════════════════════════════════════════════════════════════════════
# Actions par script : propriétaire, le projet. skraft n'en déclare aucune ; forme d'une
# déclaration (docs/08 §5.4) :
#
#   projet.verifier-migrations:
#     executable:
#       linux:   [python3, outils/verifie_migrations.py]
#       windows: [py, "-3", 'outils\verifie_migrations.py']
#     arguments: ["{fichiers}"]
#     acces: lecture
#     reseau: non
#     delai: 120s
#     resultat: { code-retour: { 0: ok, autre: ko }, sortie-standard: json }
# ════════════════════════════════════════════════════════════════════════════════════════════
actions-script: {}

# ════════════════════════════════════════════════════════════════════════════════════════════
# Actions d'agent. Propriétaires :
#   - la recette : rôle, entrées, contraintes d'écriture, outils, sortie attendue, effets ;
#   - l'extension : le contenu du prompt (agents/<role>.agent.md, partageable, ADR 0024) ;
#   - l'utilisateur : le modèle réel derrière la classe (réglages, ADR 0048) ;
#   - la plateforme : les outils terminaux et leur schéma, le contrat d'exécution ajouté en
#     dernier, et les interdits communs (aucun Git, aucun shell, preuves par run_tests,
#     fichiers gelés en lecture seule).
# Un effet est une vérification ; un effet manqué est un rejet avec motifs, puis un réessai.
# ════════════════════════════════════════════════════════════════════════════════════════════
actions-agent:

  classer:                                       # effects.ts « classify »
    role: skraft-classifier
    classe-de-modele: light
    entrees: [$story.enonce, $story.criteres, faits.indicateurs, faits.difficulte-proposee]
    ecriture: []
    sortie: submit_difficulty
    effets:
      - au-plus-un-cran-de: { valeur: sortie.level, reference: faits.difficulte-proposee }   # ÉCART : non borné aujourd'hui
    vers-faits: { difficulte-classee: sortie.level }

  rechercher:                                    # effects.ts « runSpecialist » RESEARCH, porte researchGate
    role: skraft-researcher
    classe-de-modele: standard
    entrees: [$story.enonce, $story.criteres, faits.questions-ouvertes, reponses-humaines, motifs-precedents]
    ecriture: [".skraft/{$story.slug}/**"]
    outils: [list_files, report_blocker]
    sortie: report_phase
    effets:
      - sections-presentes:
          document: ".skraft/{$story.slug}/research/research.md"
          sections: ["Périmètre et critères de succès", "Fichiers analysés", "Recherches effectuées",
                     "Conventions du projet", "Découvertes", "Approches évaluées", "Recommandation",
                     "Passage de relais"]
      - chemins-existent: { document: ".skraft/{$story.slug}/research/research.md", ignorer: [".skraft/**"] }
      - urls-bien-formees: { document: ".skraft/{$story.slug}/research/research.md" }
      - skraft.une-seule-recommandation: { document: ".skraft/{$story.slug}/research/research.md" }
    vers-faits: { questions-ouvertes: document.questions-ouvertes }

  modeliser:                                     # « runSpecialist » DESIGN, premier temps
    role: skraft-architect-model
    classe-de-modele: strong
    entrees: [$story.enonce, $story.criteres, ".skraft/{$story.slug}/research/research.md", reponses-humaines, motifs-precedents]
    ecriture: [".skraft/{$story.slug}/**"]
    outils: [list_files, report_blocker]
    sortie: report_phase
    effets: []                                   # jugé avec `decider` (écart 1 de docs/08)

  decider:                                       # « runSpecialist » DESIGN, second temps, porte checkDesign
    role: skraft-architect-decide
    classe-de-modele: strong
    entrees: [$story.enonce, $story.criteres, ".skraft/{$story.slug}/design/event-model.md", ".skraft/{$story.slug}/design/domain-model.md", motifs-precedents]
    ecriture: [".skraft/{$story.slug}/**"]       # docs/adr : seulement par l'outil render_adr
    outils: [list_files, skraft.render_adr, report_blocker]
    sortie: report_phase
    effets:
      - fichier-present: { chemin: ".skraft/{$story.slug}/design/event-model.md" }
      - skraft.noms-definis:
          definitions: [event-model.md, domain-model.md]
          citations: [contracts.md, diagrams.md]
      - skraft.adr-nouveaux-bien-formes: {}      # titre, sections, statut Proposed, pas une « bonne pratique »
      - skraft.adr-numerotation-continue: {}
      - gel-intact: { motifs: ["docs/adr/**"], sauf: nouveaux }   # ADR existants : append-only
      - skraft.remplacements-consignes: { registre: supersessions.md }
    vers-faits: { adr-proposes: adr-nouveaux }

  distiller:                                     # « runSpecialist » DISTILL, portes gherkin, valeurs, RED d'acceptance
    role: skraft-acceptance
    classe-de-modele: standard
    entrees: [$story.criteres, $story.enonce, conception, contexte.stack.acceptanceTests, motifs-precedents]
    ecriture: [".skraft/{$story.slug}/**", "@stack:acceptanceTests", "@stack:sources"]
    outils: [list_files, run_tests, report_blocker]
    sortie: report_phase
    effets:
      - skraft.gherkin-valide: {}
      - skraft.valeurs-recopiees: { depuis: $story.criteres.litteraux }     # mot pour mot
      - fichier-present: { chemin: ".skraft/{$story.slug}/distill/test-plan.md" }
      - skraft.rouge-d-acceptance: {}            # un test ac-<n> par critère, rouge pour une bonne raison
    vers-faits: { empreinte-acceptance: "geler(@stack:acceptanceTests)" }

  ecrire-test-rouge:                             # deliver-effects.ts, pas « test », porte verifyUnitRed
    role: skraft-test
    classe-de-modele: standard
    entrees: [scenario, $story.criteres, gherkin, test-acceptance, tests-deja-ecrits, motifs-precedents]
    ecriture: ["@stack:unitTests"]
    outils: [list_files, run_tests, run_lint, report_blocker]
    sortie: report_phase
    effets:
      - perimetre-respecte: { motifs: ["@stack:unitTests"] }
      - un-seul-nouveau-test: {}
      - rouge-pour-bonne-raison: {}              # assertion ou symbole manquant
      - rien-ne-regresse: {}
    variante:
      declarer-couvert-par-acceptance:           # ADR 0045, champ coveredBy
        effets:
          - aucun-fichier-modifie: {}
          - skraft.test-designe-est-celui-du-scenario: {}
          - rouge-pour-bonne-raison: {}

  coder:                                         # pas « dev » (un tour), porte verifyUnitGreen
    role: skraft-dev
    classe-de-modele: standard
    entrees: [scenario, test-a-faire-passer, motifs-precedents]
    ecriture: ["@stack:sources"]
    lecture-seule: ["@stack:acceptanceTests", "@stack:unitTests"]
    outils: [list_files, run_tests, run_lint, report_blocker]
    sortie: report_phase
    effets:
      - gel-intact: { motifs: ["@stack:unitTests", "@stack:acceptanceTests"] }   # empreinte prise au rouge
      - production-modifiee: {}
      - tests-passent: { sauf: en-attente }
      - tests-passent: { tests: [test-du-pas] }

  faire-passer-au-vert:                          # pas « green » (sessions par pas)
    herite: coder

  nettoyer:                                      # pas « refactor »
    herite: coder
    effets-retires: [production-modifiee]        # un nettoyage peut ne rien changer

  corriger-tests:                                # pas « fix-test », porte verifyFixTests (ADR 0046)
    role: skraft-test
    classe-de-modele: standard
    entrees: [faits.defauts-actifs.test, rappels]
    ecriture: ["@stack:unitTests"]
    outils: [list_files, run_tests, report_blocker]
    sortie: report_phase                         # responses : fixed / contested / outOfScope
    effets:
      - perimetre-respecte: { motifs: ["@stack:unitTests"] }
      - rien-ne-regresse: { y-compris: tests-disparus }
      - skraft.test-ajoute-vert-ou-rouge-pour-bonne-raison: {}
    vers-faits: { cibles-du-developpeur: tests-ajoutes-rouges }

  corriger-code:                                 # pas « fix »
    role: skraft-dev
    classe-de-modele: standard
    entrees: [faits.defauts-actifs.code, faits.cibles-du-developpeur, rappels]
    ecriture: ["@stack:sources"]
    lecture-seule: ["@stack:acceptanceTests", "@stack:unitTests"]
    outils: [list_files, run_tests, run_lint, report_blocker]
    sortie: report_phase
    effets:
      - gel-intact: { motifs: ["@stack:unitTests", "@stack:acceptanceTests"] }
      - production-modifiee: {}
      - tests-passent: {}
      - tests-passent: { tests: faits.cibles-du-developpeur }
      - contrat-respecte: { noms: faits.noms-du-contrat }                      # ADR 0047

  relire:                                        # une session par lentille, « runReview »
    role: "skraft-lens-{lentille}"
    classe-de-modele: { quality-gates: light, autres: standard }
    entrees: [livrables, code, tests, faits-etablis, mes-defauts-precedents]
    ecriture: []
    sortie: submit_lens_verdict                  # verdict, défauts (cible obligatoire), arbitrages
    effets: []                                   # un jugement ne se vérifie pas : il est synthétisé

# ════════════════════════════════════════════════════════════════════════════════════════════
# Actions humaines : propriétaire de la question, la recette ; de la réponse, le profil désigné.
# Jamais d'attente bloquante : demande persistée, réinjectée comme décision.
# ════════════════════════════════════════════════════════════════════════════════════════════
actions-humaines:
  confirmer-difficulte:
    profils: [po, developpeur, architecte]
    options: [simple, medium, medium-hard, challenging]
    proposition: faits.difficulte-classee
    vers-faits: { difficulte: choix }
  repondre-question-ouverte:
    profils: [po]
    options: [repondre, reporter]
  repondre-blocage:
    profils: [po, developpeur, architecte, administrateur]
    options: choix-de-l-agent
  ratifier-adr:
    profils: [architecte]
    options: [accepter, rejeter, demander-un-amendement]
  arbitrer-desaccord:
    profils: [developpeur, architecte, administrateur]
    options: [donner-raison-a-l-agent, donner-raison-a-la-lentille]
  decider-escalade:
    profils: [developpeur, architecte, administrateur]
    options: [relancer, sauter, abandonner]

# ════════════════════════════════════════════════════════════════════════════════════════════
# Tâches et méthodes. Propriétaire : la recette. Une tâche essaie ses méthodes dans l'ordre ;
# `si:` ne lit que des faits, des entrées et des réglages. `etapes:` s'exécutent en séquence.
# Règles d'échec communes (docs/08 §4) : réessai avec motifs, puis méthode suivante, puis escalade.
# ════════════════════════════════════════════════════════════════════════════════════════════
taches:

  livrer-story:
    methodes:
      - nom: complete
        si: "faits.recherche"
        etapes:
          - preparer: {}
          - phase: { nom: RESEARCH, travail: rechercher-phase }
          - questions-ouvertes: {}
          - phase: { nom: DESIGN, travail: concevoir }
          - phase: { nom: DISTILL, travail: distiller-phase }
          - phase: { nom: DELIVER, travail: livrer }
          - skraft.rapport-final: {}
      - nom: sans-recherche
        etapes:
          - preparer: {}
          - questions-ouvertes: {}
          - phase: { nom: DESIGN, travail: concevoir }
          - phase: { nom: DISTILL, travail: distiller-phase }
          - phase: { nom: DELIVER, travail: livrer }
          - skraft.rapport-final: {}

  preparer:
    methodes:
      - etapes:
          - initialiser-story: {}
          - evaluer-difficulte: {}

  # Aujourd'hui l'effet « init » (effects.ts) fait tout cela d'un bloc. Ici, des actions atomiques
  # de la plateforme, exécutées en tout-ou-rien derrière un seul checkpoint.
  initialiser-story:
    tout-ou-rien: true
    methodes:
      - etapes:
          - lire-entree:   { entree: $story }            # valide le format ; échec = arrêt avant tout agent
          - noter-depart:  {}                            # -> faits.base-sha
          - creer-branche: { nom: "skraft/{$story.slug}" }
          - creer-dossier: { chemin: ".skraft/{$story.slug}/research" }
          - creer-dossier: { chemin: ".skraft/{$story.slug}/design" }
          - creer-dossier: { chemin: ".skraft/{$story.slug}/distill/features" }
          - creer-dossier: { chemin: ".skraft/{$story.slug}/reviews" }
          - enregistrer:   { chemin: ".skraft/{$story.slug}/story.md", contenu: $story.brut }   # NOUVEAU : la story du chat reste dans le dépôt
    sur-echec: { escalade: [relancer, abandonner] }

  # Le code mesure et propose, l'agent ajuste d'un cran au plus, l'humain confirme si demandé.
  evaluer-difficulte:
    methodes:
      - nom: confirmee-par-l-humain
        si: "$confirmer-difficulte"
        etapes:
          - skraft.mesurer-indicateurs: { story: $story, depot: contexte.depot }     # -> faits.indicateurs
          - skraft.proposer-difficulte: { indicateurs: faits.indicateurs, grille: reglages.grille }
          - classer: {}
          - confirmer-difficulte: {}
      - nom: automatique
        etapes:
          - skraft.mesurer-indicateurs: { story: $story, depot: contexte.depot }
          - skraft.proposer-difficulte: { indicateurs: faits.indicateurs, grille: reglages.grille }
          - classer: {}
          - retenir: { fait: difficulte, valeur: faits.difficulte-classee }
    sur-echec:
      classer: { reessai: 2, puis: { escalade: [relancer, abandonner] } }

  # Le cadre commun de toute phase : checkpoint, travail, revue, ratification, commit.
  phase:
    parametres: { nom: texte, travail: tache }
    methodes:
      - nom: avec-revue
        si: "nom in reglages.phases-revues"
        etapes:
          - poser-checkpoint: {}
          - "{travail}": {}
          - revue-de-phase: { phase: "{nom}" }
          - ratification: {}
          - commiter: { message: "skraft({$story.slug}): {nom}" }    # rapports de revue réécrits avant
      - nom: sans-revue
        etapes:
          - poser-checkpoint: {}
          - "{travail}": {}
          - commiter: { message: "skraft({$story.slug}): {nom}" }
    sur-echec-d-un-effet:
      reessai: faits.essais-max          # même agent, motifs transmis, rien rembobiné (ADR 0040)
      puis: [rembobiner: { vers: checkpoint-de-phase }, decider-escalade: {}]
    sur-blocage-d-agent: [repondre-blocage: {}, reprendre: {}]       # ne consomme pas d'essai

  rechercher-phase:
    methodes:
      - etapes: [rechercher: {}]

  concevoir:
    methodes:
      - etapes: [modeliser: {}, decider: {}]    # un réessai reprend les deux

  distiller-phase:
    methodes:
      - etapes: [distiller: {}]

  questions-ouvertes:
    methodes:
      - nom: rien-a-demander
        si: "faits.questions-ouvertes.non-repondues == []"
        etapes: []
      - nom: demander
        etapes:
          - pour-chaque:
              liste: faits.questions-ouvertes.non-repondues
              comme: question
              faire: [repondre-question-ouverte: { question: "{question}" }]

  ratification:
    methodes:
      - nom: rien-a-ratifier
        si: "faits.adr-proposes == []"
        etapes: []
      - nom: ratifier
        etapes:
          - pour-chaque:
              liste: faits.adr-proposes
              comme: adr
              faire: [ratifier-adr: { adr: "{adr}" }]
          - skraft.appliquer-statuts-adr: {}     # « demander un amendement » relance decider avec le motif

  livrer:
    methodes:
      - etapes:
          - skraft.planifier-scenarios: {}       # préconditions : acceptance gelée intacte, suite verte hors acceptance
          - pour-chaque:
              liste: faits.scenarios
              comme: scenario
              faire: [implementer-scenario: { scenario: "{scenario}" }]
          - fichiers-produits: { motifs: livrables-de-deliver }
          - seuils-atteints: { mesure: mutation, si: "contexte.barre.mutation.moment == fin-de-phase" }
    sur-echec:
      seuils-atteints: corriger-revue           # chaque mutant survivant = défaut adressé au testeur (ADR 0049)

  implementer-scenario:
    parametres: { scenario: scenario }
    avant: [skraft.ouvrir-scenario: {}]          # -> checkpoint du scénario, faits.scenario.deja-vert
    methodes:
      - nom: deja-vert
        si: "faits.scenario.deja-vert"
        etapes: [fin-de-scenario: {}]
      - nom: un-tour
        si: "faits.granularite == tour-par-scenario and faits.scenario.echecs == 0"
        etapes:
          - boucle: { jusqu-a: test-acceptance-du-scenario-vert, plafond: reglages.cycles-par-scenario, faire: [cycle-un-tour: {}] }
          - fin-de-scenario: {}
      - nom: sessions-separees                   # aussi le repli d'un échec de « un-tour » (D22)
        etapes:
          - boucle: { jusqu-a: test-acceptance-du-scenario-vert, plafond: reglages.cycles-par-scenario, faire: [cycle-en-sessions: {}] }
          - fin-de-scenario: {}
    sur-echec:
      rembobiner: { vers: checkpoint-de-scenario }
      puis: methode-suivante
      au-dela-du-budget: decider-escalade

  fin-de-scenario:                               # « scenarioGate » : une suite de vérifications
    methodes:
      - etapes:
          - gel-intact: { empreinte: faits.empreinte-acceptance }
          - tests-passent: { tests: [test-acceptance-du-scenario] }
          - tests-passent: { sauf: en-attente }
          - sequence-rouge-puis-vert: { tests: tests-unitaires-du-scenario }
          - seuils-atteints: { mesure: couverture }
          - lint: {}
          - dependances-respectees: {}
          - seuils-atteints: { mesure: mutation, si: "contexte.barre.mutation.moment == scenario" }

  cycle-un-tour:
    methodes:
      - nom: couvert-par-acceptance              # ADR 0045 : proposé par l'agent, vérifié par la variante
        si: "sortie.coveredBy"
        etapes: [ecrire-test-rouge.declarer-couvert-par-acceptance: {}, coder: {}]
      - nom: test-puis-code
        etapes: [ecrire-test-rouge: {}, coder: {}]
    sur-echec-d-un-pas: { rembobiner: { vers: dernier-point-sur }, reessai: faits.essais-max, puis: echec }

  cycle-en-sessions:
    methodes:
      - nom: couvert-par-acceptance
        si: "sortie.coveredBy"
        etapes: [ecrire-test-rouge.declarer-couvert-par-acceptance: {}, faire-passer-au-vert: {}, nettoyer: {}]
      - nom: test-vert-nettoyage
        etapes: [ecrire-test-rouge: {}, faire-passer-au-vert: {}, nettoyer: {}]
    sur-echec-d-un-pas: { rembobiner: { vers: dernier-point-sur }, reessai: faits.essais-max, puis: echec }
    sur-echec:
      nettoyer: { rembobiner: { vers: dernier-vert }, puis: continuer }   # SPEC-skraft §8.3 : sans escalade

  revue-de-phase:
    parametres: { phase: texte }
    methodes:
      - etapes:
          - skraft.relever-contrat: { si: "phase == DELIVER" }
          - en-parallele:
              pour-chaque: faits.lentilles           # quality-gates retirée en DESIGN (lensesForPhase)
              comme: lentille
              faire: [relire: { lentille: "{lentille}" }]
          - skraft.synthese-revue: {}                # identifiants, cibles, arbitrages, verdict (ADR 0046)
    resultat:
      approuvee: continuer
      rejetee: decider-escalade                      # deux lentilles REJECTED
      desaccord-persistant: [arbitrer-desaccord: {}, skraft.synthese-revue: {}]
      changements-demandes:
        si: "phase == DELIVER"
        alors: corriger-revue
        sinon: reessai-de-la-phase                   # rappel des demandes déjà corrigées

  corriger-revue:                                    # ADR 0046, 0047
    methodes:
      - nom: tests-puis-code
        si: "faits.defauts-actifs.test != []"
        etapes: [corriger-tests: {}, corriger-code-si-besoin: {}, fin-de-scenario: {}, revue-de-phase: { phase: DELIVER }]
      - nom: code-seul
        etapes: [corriger-code: {}, fin-de-scenario: {}, revue-de-phase: { phase: DELIVER }]
    budget: faits.essais-max                         # au-delà, sauf défaut maintenu par l'humain : escalade

  corriger-code-si-besoin:
    methodes:
      - si: "faits.defauts-actifs.code != [] or faits.cibles-du-developpeur != []"
        etapes: [corriger-code: {}]
      - etapes: []

  apres-escalade:
    methodes:
      - si: "decision == relancer"
        etapes: [reprendre-la-tache-echouee: {}]     # budget remis à zéro
      - si: "decision == sauter and origine == phase"
        etapes: [rembobiner: { vers: checkpoint-de-phase }, phase-suivante: {}]
      - si: "decision == abandonner"
        etapes: []
