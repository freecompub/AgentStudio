<line x1="174" y1="533" x2="174" y2="556" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<path d="M 324 598 H 334 V 223 H 327" stroke="#8a4fc7" stroke-width="1.4" fill="none" marker-end="url(#pointe-boucle)"/>
<text x="339" y="236" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">échec : correction</text>
<text x="339" y="248" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">reprise depuis son</text>
<text x="339" y="260" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">entrée</text>
