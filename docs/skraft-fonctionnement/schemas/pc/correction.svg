<svg viewBox="0 0 640 651" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/></marker>
<marker id="pointe-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/></marker>
<marker id="pointe-boucle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fc7"/></marker>
</defs>
<text x="24" y="24" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">Correction ciblée (revue ou portes de fin)</text>
<rect x="24" y="40" width="300" height="75" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="53" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="70" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Défauts en fils, numérotés par le</text>
<text x="32" y="86" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">code</text>
<text x="32" y="102" font-family="Roboto" font-size="11" fill="#46505e">cible test ou code ; un essai consommé</text>
<rect x="24" y="141" width="300" height="46" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="154" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="171" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Retour au dernier vert</text>
<rect x="24" y="213" width="300" height="59" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="32" y="226" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="32" y="243" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">fix-test : skraft-test</text>
<text x="32" y="259" font-family="Roboto" font-size="11" fill="#46505e">ajoute un test, ou conteste, ou renvoie</text>
<rect x="24" y="298" width="300" height="62" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="32" y="311" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="32" y="328" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Mutants contestés :</text>
<text x="32" y="344" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">skraft-mutation-arbiter</text>
<rect x="24" y="386" width="300" height="62" rx="16" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.6"/>
<text x="32" y="399" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#d9822b">HUMAIN</text>
<text x="32" y="416" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Humain : mutants refusés,</text>
<text x="32" y="432" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">couverture contestée</text>
<rect x="24" y="474" width="300" height="59" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="32" y="487" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="32" y="504" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">fix : skraft-dev</text>
<text x="32" y="520" font-family="Roboto" font-size="11" fill="#46505e">corrige, ou conteste chaque défaut</text>
<rect x="24" y="559" width="300" height="62" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="572" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="589" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Porte de fin de scénario, puis</text>
<text x="32" y="605" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">revue</text>
