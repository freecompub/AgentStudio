<svg viewBox="0 0 640 508" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/></marker>
<marker id="pointe-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/></marker>
<marker id="pointe-boucle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fc7"/></marker>
</defs>
<text x="24" y="24" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">Boucle TDD d'un scénario</text>
<rect x="24" y="40" width="300" height="59" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="32" y="53" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="32" y="70" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Pas test : skraft-test</text>
<text x="32" y="86" font-family="Roboto" font-size="11" fill="#46505e">un nouveau test unitaire rouge, ou coveredBy</text>
<rect x="24" y="125" width="300" height="72" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="138" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="155" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Porte RED</text>
<text x="32" y="171" font-family="Roboto" font-size="11" fill="#46505e">un seul nouveau test, rouge pour une bonne</text>
<text x="32" y="184" font-family="Roboto" font-size="11" fill="#46505e">raison, ajouts seulement</text>
<rect x="24" y="223" width="300" height="72" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="32" y="236" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="32" y="253" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Pas vert : skraft-dev</text>
<text x="32" y="269" font-family="Roboto" font-size="11" fill="#46505e">le code minimal ; en sessions séparées, puis</text>
<text x="32" y="282" font-family="Roboto" font-size="11" fill="#46505e">nettoyage</text>
<rect x="24" y="321" width="300" height="72" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="334" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="351" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Porte GREEN (puis REFACTOR)</text>
<text x="32" y="367" font-family="Roboto" font-size="11" fill="#46505e">tests gelés, production modifiée, suite</text>
<text x="32" y="380" font-family="Roboto" font-size="11" fill="#46505e">verte</text>
<rect x="24" y="419" width="300" height="59" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="432" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="449" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Acceptance du scénario verte ?</text>
<text x="32" y="465" font-family="Roboto" font-size="11" fill="#46505e">sinon nouveau cycle, 20 au plus</text>
<line x1="174" y1="99" x2="174" y2="122" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="197" x2="174" y2="220" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="295" x2="174" y2="318" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="393" x2="174" y2="416" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="324" y1="448.5" x2="391" y2="448.5" stroke="#b5442c" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#pointe-rouge)"/>
<rect x="394" y="424.5" width="230" height="48" rx="10" fill="#eceff3" stroke="#6b7684" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="402" y="440.5" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">Verte : porte de fin de</text>
<text x="402" y="454.5" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">scénario</text>
<path d="M 324 169 H 334 V 50 H 327" stroke="#8a4fc7" stroke-width="1.4" fill="none" marker-end="url(#pointe-boucle)"/>
<text x="363" y="63" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">pas refusé : retour au</text>
<text x="363" y="75" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">point sûr</text>
<path d="M 324 365 H 346 V 233 H 327" stroke="#8a4fc7" stroke-width="1.4" fill="none" marker-end="url(#pointe-boucle)"/>
<text x="363" y="246" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">pas refusé : retour au</text>
<text x="363" y="258" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">point sûr</text>
<path d="M 324 456.5 H 358 V 50 H 327" stroke="#8a4fc7" stroke-width="1.4" fill="none" marker-end="url(#pointe-boucle)"/>
<text x="363" y="91.8" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">rouge : cycle suivant</text>
</svg>