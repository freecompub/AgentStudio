<svg viewBox="0 0 640 925" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/></marker>
<marker id="pointe-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/></marker>
<marker id="pointe-boucle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fc7"/></marker>
</defs>
<text x="24" y="24" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">Pipeline skraft, de la story au code livré</text>
<rect x="24" y="40" width="300" height="88" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="53" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="70" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">INIT : lecture de la story,</text>
<text x="32" y="86" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">précontrôle des tests</text>
<text x="32" y="102" font-family="Roboto" font-size="11" fill="#46505e">branche skraft/&lt;slug&gt;, dossiers</text>
<text x="32" y="115" font-family="Roboto" font-size="11" fill="#46505e">.skraft/&lt;slug&gt;/</text>
<rect x="24" y="154" width="300" height="75" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="32" y="167" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="32" y="184" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">CLASSIFY : skraft-classifier</text>
<text x="32" y="200" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">propose un niveau</text>
<text x="32" y="216" font-family="Roboto" font-size="11" fill="#46505e">entrée : indicateurs et niveau de la grille</text>
<rect x="24" y="255" width="300" height="75" rx="16" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.6"/>
<text x="32" y="268" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#d9822b">HUMAIN</text>
<text x="32" y="285" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">CONFIRM_DIFFICULTY : niveau</text>
<text x="32" y="301" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">confirmé</text>
<text x="32" y="317" font-family="Roboto" font-size="11" fill="#46505e">sauf mode --auto</text>
<rect x="24" y="356" width="300" height="88" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="32" y="369" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="32" y="386" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">RESEARCH (sauf niveaux simple et</text>
<text x="32" y="402" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">medium)</text>
<text x="32" y="418" font-family="Roboto" font-size="11" fill="#46505e">agent skraft-researcher, porte citations,</text>
<text x="32" y="431" font-family="Roboto" font-size="11" fill="#46505e">commit</text>
<rect x="24" y="470" width="300" height="59" rx="16" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.6"/>
<text x="32" y="483" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#d9822b">HUMAIN</text>
<text x="32" y="500" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">ROUTE : questions ouvertes</text>
<text x="32" y="516" font-family="Roboto" font-size="11" fill="#46505e">story et recherche ; répondre ou reporter</text>
<rect x="24" y="555" width="300" height="72" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="32" y="568" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="32" y="585" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DESIGN, puis RATIFICATION des ADR</text>
<text x="32" y="601" font-family="Roboto" font-size="11" fill="#46505e">architectes, porte cohérence, revue,</text>
<text x="32" y="614" font-family="Roboto" font-size="11" fill="#46505e">architecte humain</text>
<rect x="24" y="653" width="300" height="72" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="32" y="666" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="32" y="683" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DISTILL</text>
<text x="32" y="699" font-family="Roboto" font-size="11" fill="#46505e">skraft-acceptance, 4 portes, revue, gel des</text>
<text x="32" y="712" font-family="Roboto" font-size="11" fill="#46505e">tests d'acceptance</text>
<rect x="24" y="751" width="300" height="72" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="32" y="764" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="32" y="781" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DELIVER</text>
<text x="32" y="797" font-family="Roboto" font-size="11" fill="#46505e">scénario par scénario en TDD, portes de fin,</text>
<text x="32" y="810" font-family="Roboto" font-size="11" fill="#46505e">revue</text>
<rect x="24" y="849" width="300" height="46" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="862" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="879" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DONE : rapport final publié</text>
<line x1="174" y1="128" x2="174" y2="151" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="229" x2="174" y2="252" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="330" x2="174" y2="353" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="444" x2="174" y2="467" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="529" x2="174" y2="552" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="627" x2="174" y2="650" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="725" x2="174" y2="748" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="823" x2="174" y2="846" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="324" y1="84" x2="391" y2="84" stroke="#b5442c" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#pointe-rouge)"/>
<rect x="394" y="53" width="230" height="62" rx="10" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="402" y="69" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">Story invalide ou tests</text>
<text x="402" y="83" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">rouges : relancer ou</text>
<text x="402" y="97" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">abandonner</text>
<line x1="324" y1="591" x2="391" y2="591" stroke="#b5442c" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#pointe-rouge)"/>
<rect x="394" y="560" width="230" height="62" rx="10" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="402" y="576" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">Toute phase : escalade</text>
<text x="402" y="590" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">relancer, sauter,</text>
<text x="402" y="604" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">abandonner</text>
</svg>