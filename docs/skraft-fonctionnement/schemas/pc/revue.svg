<svg viewBox="0 0 640 517" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/></marker>
<marker id="pointe-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/></marker>
<marker id="pointe-boucle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fc7"/></marker>
</defs>
<text x="24" y="24" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">Revue par lentilles</text>
<rect x="24" y="40" width="300" height="72" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="53" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="70" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Dossier de chaque lentille</text>
<text x="32" y="86" font-family="Roboto" font-size="11" fill="#46505e">fichiers de la phase, faits mesurés,</text>
<text x="32" y="99" font-family="Roboto" font-size="11" fill="#46505e">historique de ses défauts</text>
<rect x="24" y="138" width="300" height="75" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="32" y="151" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="32" y="168" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Lentilles en parallèle, sessions</text>
<text x="32" y="184" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">neuves</text>
<text x="32" y="200" font-family="Roboto" font-size="11" fill="#46505e">verdict, défauts, arbitrages</text>
<rect x="24" y="239" width="300" height="62" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="252" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="269" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Numérotation et routage des</text>
<text x="32" y="285" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">défauts</text>
<rect x="24" y="327" width="300" height="72" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="340" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="357" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Synthèse du verdict</text>
<text x="32" y="373" font-family="Roboto" font-size="11" fill="#46505e">questions pondérées ; une question sans</text>
<text x="32" y="386" font-family="Roboto" font-size="11" fill="#46505e">lentille interdit l'approbation</text>
<rect x="24" y="425" width="300" height="62" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="438" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="32" y="455" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Issue : approuver, corriger,</text>
<text x="32" y="471" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">escalader</text>
<line x1="174" y1="112" x2="174" y2="135" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="174" y1="213" x2="174" y2="236" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
