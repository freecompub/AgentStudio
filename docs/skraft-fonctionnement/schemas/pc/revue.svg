<rect x="394" y="151.5" width="230" height="48" rx="10" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="402" y="167.5" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">Question d'une lentille :</text>
<text x="402" y="181.5" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">réponse de l'humain</text>
<line x1="324" y1="270" x2="391" y2="270" stroke="#b5442c" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#pointe-rouge)"/>
<rect x="394" y="246" width="230" height="48" rx="10" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="402" y="262" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">Désaccord persistant :</text>
<text x="402" y="276" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">arbitrage humain</text>
