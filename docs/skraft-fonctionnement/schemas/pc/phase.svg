<text x="32" y="70" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Checkpoint de phase</text>
<text x="32" y="86" font-family="Roboto" font-size="11" fill="#46505e">point de retour pour une escalade</text>
<rect x="24" y="125" width="300" height="88" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="32" y="138" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
