<text x="32" y="468" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Revue : lentilles en parallèle</text>
<text x="32" y="484" font-family="Roboto" font-size="11" fill="#46505e">chacune rend submit_lens_verdict ; RESEARCH</text>
