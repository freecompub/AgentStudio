<text x="32" y="285" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">session neuve</text>
<text x="32" y="301" font-family="Roboto" font-size="11" fill="#46505e">écrit ses livrables, rend report_phase</text>
