<svg viewBox="0 0 426 1003" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/></marker>
<marker id="pointe-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/></marker>
<marker id="pointe-boucle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fc7"/></marker>
</defs>
<text x="8" y="24" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">Pipeline skraft, de la story au code</text>
<text x="8" y="44" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">livré</text>
<rect x="8" y="60" width="250" height="88" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="16" y="73" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="16" y="90" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">INIT : lecture de la story,</text>
<text x="16" y="106" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">précontrôle des tests</text>
<text x="16" y="122" font-family="Roboto" font-size="11" fill="#46505e">branche skraft/&lt;slug&gt;, dossiers</text>
<text x="16" y="135" font-family="Roboto" font-size="11" fill="#46505e">.skraft/&lt;slug&gt;/</text>
<rect x="8" y="174" width="250" height="104" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="16" y="187" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="16" y="204" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">CLASSIFY :</text>
<text x="16" y="220" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">skraft-classifier propose</text>
<text x="16" y="236" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">un niveau</text>
<text x="16" y="252" font-family="Roboto" font-size="11" fill="#46505e">entrée : indicateurs et niveau de</text>
<text x="16" y="265" font-family="Roboto" font-size="11" fill="#46505e">la grille</text>
<rect x="8" y="304" width="250" height="75" rx="16" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.6"/>
<text x="16" y="317" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#d9822b">HUMAIN</text>
<text x="16" y="334" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">CONFIRM_DIFFICULTY : niveau</text>
<text x="16" y="350" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">confirmé</text>
<text x="16" y="366" font-family="Roboto" font-size="11" fill="#46505e">sauf mode --auto</text>
<rect x="8" y="405" width="250" height="88" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="16" y="418" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="16" y="435" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">RESEARCH (sauf niveaux</text>
<text x="16" y="451" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">simple et medium)</text>
<text x="16" y="467" font-family="Roboto" font-size="11" fill="#46505e">agent skraft-researcher, porte</text>
<text x="16" y="480" font-family="Roboto" font-size="11" fill="#46505e">citations, commit</text>
<rect x="8" y="519" width="250" height="72" rx="16" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.6"/>
<text x="16" y="532" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#d9822b">HUMAIN</text>
<text x="16" y="549" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">ROUTE : questions ouvertes</text>
<text x="16" y="565" font-family="Roboto" font-size="11" fill="#46505e">story et recherche ; répondre ou</text>
<text x="16" y="578" font-family="Roboto" font-size="11" fill="#46505e">reporter</text>
<rect x="8" y="617" width="250" height="88" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="16" y="630" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="16" y="647" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DESIGN, puis RATIFICATION</text>
<text x="16" y="663" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">des ADR</text>
<text x="16" y="679" font-family="Roboto" font-size="11" fill="#46505e">architectes, porte cohérence,</text>
<text x="16" y="692" font-family="Roboto" font-size="11" fill="#46505e">revue, architecte humain</text>
<rect x="8" y="731" width="250" height="72" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="16" y="744" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="16" y="761" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DISTILL</text>
<text x="16" y="777" font-family="Roboto" font-size="11" fill="#46505e">skraft-acceptance, 4 portes, revue,</text>
<text x="16" y="790" font-family="Roboto" font-size="11" fill="#46505e">gel des tests d'acceptance</text>
<rect x="8" y="829" width="250" height="72" rx="18" fill="#eceff3" stroke="#6b7684" stroke-width="1.6"/>
<text x="16" y="842" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#6b7684">ÉTAT</text>
<text x="16" y="859" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DELIVER</text>
<text x="16" y="875" font-family="Roboto" font-size="11" fill="#46505e">scénario par scénario en TDD,</text>
<text x="16" y="888" font-family="Roboto" font-size="11" fill="#46505e">portes de fin, revue</text>
<rect x="8" y="927" width="250" height="46" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="16" y="940" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="16" y="957" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">DONE : rapport final publié</text>
<line x1="133" y1="148" x2="133" y2="171" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="278" x2="133" y2="301" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="379" x2="133" y2="402" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="493" x2="133" y2="516" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="591" x2="133" y2="614" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="705" x2="133" y2="728" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="803" x2="133" y2="826" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="901" x2="133" y2="924" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="258" y1="104" x2="289" y2="104" stroke="#b5442c" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#pointe-rouge)"/>
<rect x="292" y="66" width="128" height="76" rx="10" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="300" y="82" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">Story invalide ou</text>
<text x="300" y="96" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">tests rouges :</text>
<text x="300" y="110" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">relancer ou</text>
<text x="300" y="124" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">abandonner</text>
<line x1="258" y1="661" x2="289" y2="661" stroke="#b5442c" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#pointe-rouge)"/>
<rect x="292" y="623" width="128" height="76" rx="10" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="300" y="639" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">Toute phase :</text>
<text x="300" y="653" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">escalade</text>
<text x="300" y="667" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">relancer, sauter,</text>
<text x="300" y="681" font-family="Roboto" font-weight="600" font-size="11.5" fill="#8a2f1c">abandonner</text>
</svg>