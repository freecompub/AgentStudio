<text x="273" y="281" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">correction</text>
<text x="273" y="293" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">reprise</text>
