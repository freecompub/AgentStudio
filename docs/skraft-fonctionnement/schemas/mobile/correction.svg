<text x="16" y="374" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Mutants contestés :</text>
<text x="16" y="390" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">skraft-mutation-arbiter</text>
<rect x="8" y="432" width="250" height="62" rx="16" fill="#fdf0dc" stroke="#d9822b" stroke-width="1.6"/>
<text x="16" y="445" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#d9822b">HUMAIN</text>
<text x="16" y="462" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Humain : mutants refusés,</text>
<text x="16" y="478" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">couverture contestée</text>
<rect x="8" y="520" width="250" height="59" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="16" y="533" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="16" y="550" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">fix : skraft-dev</text>
<text x="16" y="566" font-family="Roboto" font-size="11" fill="#46505e">corrige, ou conteste chaque défaut</text>
<rect x="8" y="605" width="250" height="62" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="16" y="618" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="16" y="635" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Porte de fin de scénario,</text>
<text x="16" y="651" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">puis revue</text>
