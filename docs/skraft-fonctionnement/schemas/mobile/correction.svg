<text x="8" y="24" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">Correction ciblée (revue ou portes</text>
<text x="8" y="44" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">de fin)</text>
