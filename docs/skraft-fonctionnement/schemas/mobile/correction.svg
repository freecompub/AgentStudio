<text x="16" y="259" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="16" y="276" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">fix-test : skraft-test</text>
<text x="16" y="292" font-family="Roboto" font-size="11" fill="#46505e">ajoute un test, ou conteste, ou</text>
<text x="16" y="305" font-family="Roboto" font-size="11" fill="#46505e">renvoie</text>
