<text x="16" y="90" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Défauts en fils, numérotés</text>
<text x="16" y="106" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">par le code</text>
<text x="16" y="122" font-family="Roboto" font-size="11" fill="#46505e">cible test ou code ; un essai</text>
<text x="16" y="135" font-family="Roboto" font-size="11" fill="#46505e">consommé</text>
