<text x="16" y="305" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">un tour, session neuve</text>
<text x="16" y="321" font-family="Roboto" font-size="11" fill="#46505e">écrit ses livrables, rend</text>
