<text x="16" y="517" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">parallèle</text>
<text x="16" y="533" font-family="Roboto" font-size="11" fill="#46505e">chacune rend submit_lens_verdict ;</text>
