<text x="297" y="259" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">pas refusé :</text>
<text x="297" y="271" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">retour au</text>
<text x="297" y="283" font-family="Roboto" font-style="italic" font-size="10.5" fill="#6b3aa3">point sûr</text>
