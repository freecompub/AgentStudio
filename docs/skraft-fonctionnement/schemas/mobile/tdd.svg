<line x1="133" y1="210" x2="133" y2="233" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="308" x2="133" y2="331" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="133" y1="406" x2="133" y2="429" stroke="#3a4250" stroke-width="1.6" marker-end="url(#pointe)"/>
<line x1="258" y1="469.5" x2="289" y2="469.5" stroke="#b5442c" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#pointe-rouge)"/>
<rect x="292" y="445.5" width="128" height="48" rx="10" fill="#eceff3" stroke="#6b7684" stroke-width="1.4" stroke-dasharray="5 3"/>
