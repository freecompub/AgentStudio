<svg viewBox="0 0 426 537" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4250"/></marker>
<marker id="pointe-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5442c"/></marker>
<marker id="pointe-boucle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a4fc7"/></marker>
</defs>
<text x="8" y="24" font-family="Roboto" font-weight="700" font-size="16" fill="#13213a">Boucle TDD d'un scénario</text>
<rect x="8" y="40" width="250" height="72" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="16" y="53" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="16" y="70" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Pas test : skraft-test</text>
<text x="16" y="86" font-family="Roboto" font-size="11" fill="#46505e">un nouveau test unitaire rouge, ou</text>
<text x="16" y="99" font-family="Roboto" font-size="11" fill="#46505e">coveredBy</text>
<rect x="8" y="138" width="250" height="72" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="16" y="151" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="16" y="168" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Porte RED</text>
<text x="16" y="184" font-family="Roboto" font-size="11" fill="#46505e">un seul nouveau test, rouge pour</text>
<text x="16" y="197" font-family="Roboto" font-size="11" fill="#46505e">une bonne raison, ajouts seulement</text>
<rect x="8" y="236" width="250" height="72" rx="6" fill="#e3eefc" stroke="#2f6fd6" stroke-width="1.6"/>
<text x="16" y="249" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2f6fd6">AGENT</text>
<text x="16" y="266" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Pas vert : skraft-dev</text>
<text x="16" y="282" font-family="Roboto" font-size="11" fill="#46505e">le code minimal ; en sessions</text>
<text x="16" y="295" font-family="Roboto" font-size="11" fill="#46505e">séparées, puis nettoyage</text>
<rect x="8" y="334" width="250" height="72" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="16" y="347" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="16" y="364" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Porte GREEN (puis REFACTOR)</text>
<text x="16" y="380" font-family="Roboto" font-size="11" fill="#46505e">tests gelés, production modifiée,</text>
<text x="16" y="393" font-family="Roboto" font-size="11" fill="#46505e">suite verte</text>
<rect x="8" y="432" width="250" height="75" rx="6" fill="#e4f5e6" stroke="#2e8b42" stroke-width="1.6"/>
<text x="16" y="445" font-family="Roboto" font-weight="700" font-size="9" letter-spacing="0.6" fill="#2e8b42">CODE</text>
<text x="16" y="462" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">Acceptance du scénario</text>
<text x="16" y="478" font-family="Roboto" font-weight="600" font-size="13" fill="#1d2430">verte ?</text>
<text x="16" y="494" font-family="Roboto" font-size="11" fill="#46505e">sinon nouveau cycle, 20 au plus</text>
